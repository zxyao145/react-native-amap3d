buildscript {
    def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.1.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def getExt(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def kotlinVersion = getExt('kotlinVersion', '2.1.20')

android {
    namespace "qiuxiang.amap3d"
    compileSdkVersion getExt('compileSdkVersion', 36)
    buildToolsVersion getExt('buildToolsVersion', '36.0.0')

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            manifest.srcFile 'src/main/AndroidManifest.xml'
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    defaultConfig {
        minSdkVersion getExt('minSdkVersion', 24)
        targetSdkVersion getExt('targetSdkVersion', 36)
    }
}

dependencies {
    compileOnly 'com.facebook.react:react-android'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation files('libs/AMap3DMap_10.1.600_AMapSearch_9.7.4_AMapLocation_6.5.1_20251020.jar')
}
